  var head=contas[0], body=contas.slice(1).sort(function(a,b){var x=a[0].split('/').reverse().join(''),y=b[0].split('/').reverse().join('');return x<y?-1:1});
  if(body.length)h+='<h2>Contas do mês</h2>'+t([head].concat(body));
  // próximos 12 meses
  var pm=[['Mês','Receitas','Despesas','Parcelas','Sobra','% saídas']];
  for(var i=0;i<12;i++){var m=ymAdd(k,i),r=receitaMes(m),dd=despesaMes(m),pp=parcelasMes(m),so=r-dd-pp;pm.push([ymShort(m),money(r),money(dd),money(pp),'<span class="'+(so<0?'neg':'pos')+'">'+money(so)+'</span>',r>0?Math.round((dd+pp)/r*100)+'%':'—'])}
  h+='<h2>Próximos 12 meses</h2>'+t(pm);
  if(S.dividas.length){
    var dv=[['#','Dívida','Parcela','Pagas','Saldo','Termina','Status']];
    ord.forEach(function(x,i){dv.push([i+1,esc(x.d.nome)+(x.d.credor?' <span class="muted">· '+esc(x.d.credor)+'</span>':''),money(x.d.parcela),x.c.pagas+'/'+x.c.total,money(x.c.saldo),ymShort(x.c.ultimoMes),STATUS[x.c.status][0]])});
    S.dividas.filter(function(d){return calc(d).rest===0}).forEach(function(d){var c=calc(d);dv.push(['✓',esc(d.nome),money(d.parcela),c.pagas+'/'+c.total,money(0),ymShort(c.ultimoMes),'Quitada'])});
    h+='<h2>Dívidas <span class="muted" style="text-transform:none;letter-spacing:0">(ordem sugerida: '+(S.ajustes.estrategia==='bola'?'bola de neve':'avalanche')+')</span></h2>'+t(dv);
  }
  function lanc(list,kind){
    var rows=[['Descrição','Categoria','Tipo','Valor em '+ymShort(k),'Observação']];
    list.forEach(function(r){var v=r.tipo==='fixa'?valorNoMes(r,k):r.valor;if(r.tipo!=='fixa'&&ym(r.data)!==k)return;if(r.tipo==='fixa'&&!ativoNoMes(r,k))return;
      rows.push([esc(r.descricao),esc(r.categoria||''),r.tipo==='fixa'?(kind==='receita'?'Recorrente':'Fixa'):'Avulsa ('+br(r.data).slice(0,5)+')',money(v),esc(histTxt(r))])});
    return rows.length>1?t(rows):'<p class="muted">Nenhuma neste mês.</p>';
  }
  h+='<h2>Receitas do mês</h2>'+lanc(S.receitas,'receita');
  h+='<h2>Despesas do mês</h2>'+lanc(S.despesas,'despesa');
  h+='<footer>Quita v'+VERSION+' · Auxano</footer></body></html>';
  return h;
}
function exportPDF(){
  var name='Quita-relatorio-'+todayISO();
  var html=pdfHTML();
  if(HAS_NATIVE&&Android.printPdf){Android.printPdf(html,name);toast('Escolha "Salvar como PDF" na próxima tela')}
  else{var w=window.open('','_blank');if(w){w.document.write(html);w.document.close();setTimeout(function(){w.print()},300)}else saveFile(name+'.html','text/html',html)}
}

/* ---------------- sincronização ---------------- */
var cbs={}, syncTimer=null, syncing=false;
window.quitaCb=function(id,ok,msg){var f=cbs[id];delete cbs[id];if(f)f(ok,msg)};
function request(url,body,cb){
  var id=uid();cbs[id]=cb;
  if(HAS_NATIVE){Android.sync(url,JSON.stringify(body),id)}
  else{
    fetch(url,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain;charset=utf-8'}})
      .then(function(r){return r.json()}).then(function(j){window.quitaCb(id,!!j.ok,j.msg||'')})
      .catch(function(){window.quitaCb(id,false,'No navegador a sincronização pode ser bloqueada; use o app.')});
  }
}
function buildPayload(){
  var k=curYM();
  var dv=[['Nome','Credor','Data da compra','Valor da parcela','Nº de parcelas','Pagas','Restantes','Valor total','Saldo','% pago','Juros % a.m.','Dia venc.','1ª parcela','Última parcela','Próxima parcela','Status','Observação']];
  S.dividas.forEach(function(d){var c=calc(d);dv.push([d.nome,d.credor||'',d.dataCompra?br(d.dataCompra):'',r2(d.parcela),c.total,c.pagas,c.rest,c.valorTotal,c.saldo,r2(c.prog*100),d.jurosMes||0,d.diaVenc,ymShort(d.primeiraMes),ymShort(c.ultimoMes),c.prox?br(c.prox.venc):'',STATUS[c.status][0],d.obs||''])});
  var pc=[['Mês','Dívida','Parcela','Valor','Vencimento','Situação']];
  todasParcelas().forEach(function(r){pc.push(r.slice(0,6))});
  var pm=porMesTabela(), rc=lancTabela('receita'), dsp=lancTabela('despesa');
  var rec=receitaMes(k),parc=parcelasMes(k),desp=despesaMes(k),pct=comprometimento(k),ord=ordemSugerida(),atr=totalAtraso();
  var rs=[['Indicador','Valor'],
    ['Atualizado em',br(todayISO())+' '+new Date().toTimeString().slice(0,5)],
    ['Mês de referência',ymLabel(k)],
    ['Receitas do mês',r2(rec)],['Despesas do mês',r2(desp)],['Despesas pagas',r2(despPagoMes(k))],['Parcelas do mês',r2(parc)],['Sobra do mês',r2(rec-desp-parc)],
    ['% da receita em saídas',isFinite(pct)?r2(pct*100):''],['% da receita em dívidas',isFinite(pctDividas(k))?r2(pctDividas(k)*100):''],['Situação',faixa(pct)[0]],
    ['Pago no mês',r2(pagoMes(k))],['Parcelas atrasadas',atr.n],['Valor em atraso',r2(atr.valor)],
    ['Total devido',r2(totalDevido())],['Dívidas em aberto',ord.length],
    ['Livre das dívidas em',fimDeTudo()?ymLabel(fimDeTudo()):'—'],
    ['Estratégia',S.ajustes.estrategia==='bola'?'Bola de neve':'Avalanche'],
    ['',''],['Ordem sugerida','Saldo']];
  ord.forEach(function(x,i){rs.push([(i+1)+'º '+x.d.nome,x.c.saldo])});
  var mt=[['Meta','Tipo','Objetivo','Guardado','Falta','% atingido','Prazo','Por mês até o prazo']];
  S.metas.forEach(function(m){var i=metaInfo(m);mt.push([m.nome,metaTipo(m.tipo)[1],r2(m.alvo),i.g,i.falta,r2(i.pct*100),m.prazo?br(m.prazo):'',m.prazo&&!i.ok?i.porMes:''])});
  return {action:'sync',order:['Resumo','Por mês','Receitas','Despesas','Dívidas','Parcelas','Metas'],
    sheets:{'Resumo':rs,'Dívidas':dv,'Parcelas':pc,'Por mês':pm,'Receitas':rc,'Despesas':dsp,'Metas':mt},
    historico:{data:br(todayISO()),totalDevido:r2(totalDevido()),receitaMes:r2(rec),despesasMes:r2(desp),parcelasMes:r2(parc),comprometido:isFinite(pct)?r2(pct*100):'',pagoMes:r2(pagoMes(k)),abertas:ord.length}};
}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(function(){syncNow(false)},1500)}
function syncNow(manual){
  var a=S.ajustes;
  if(!temPlanilha()){if(manual){toast('Configure a planilha em Ajustes');openSettings()}return}
  if(syncing){scheduleSync();return}
  syncing=true;updSyncDot('run');if(manual)toast('Sincronizando…');
  if(googleOn()){gSyncManual=manual;Android.gSync(JSON.stringify(gPayload()),a.google.id||'');return}
  request(a.url,buildPayload(),function(ok,msg){
    syncing=false;
    if(ok){a.pendente=false;a.erro='';a.ultimoSync=new Date().toISOString();if(manual)toast('Planilha atualizada ✓')}
    else{a.pendente=true;a.erro=msg||'erro';if(manual)toast('Falhou: '+msg)}
    persist();updSyncDot();if(curTab==='relatorio')renderRelatorio();
  });
}
function syncText(){
  var a=S.ajustes;
  if(!temPlanilha())return 'Planilha online não configurada.';
  var t=a.ultimoSync?'Última sincronização: '+br(a.ultimoSync.slice(0,10))+' às '+new Date(a.ultimoSync).toTimeString().slice(0,5):'Ainda não sincronizado.';
  if(a.pendente)t+=' Há alterações pendentes.';
  if(a.erro)t+=' Último erro: '+a.erro;
  return t;
}
function updSyncDot(state){
  var i=$('#syncDot'),a=S.ajustes;
  var on=temPlanilha();
  i.className=!on?'':state==='run'?'pend':a.erro?'err':a.pendente?'pend':'ok';
  $('#btnSync').hidden=!on;
  $('#topSub').textContent=!on?'Controle financeiro':state==='run'?'Sincronizando…':a.erro?'Planilha: erro na sincronização':a.pendente?'Planilha: alterações pendentes':'Planilha sincronizada';
}

/* ---------------- tema ---------------- */
var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
var themeReady=false;
/* dissolve a tela inteira de um tema para o outro (sem cada parte mudar num ritmo) */
function trocaSuave(fn,novo){
  if(document.startViewTransition){try{document.startViewTransition(fn);return}catch(e){}}
  var f=document.getElementById('tfade');
  if(!f){f=document.createElement('div');f.id='tfade';document.body.appendChild(f)}
  f.style.background=novo==='dark'?'#111113':'#F3F4F6';
  requestAnimationFrame(function(){f.style.opacity='1';setTimeout(function(){fn();requestAnimationFrame(function(){f.style.opacity='0'})},230)});
}
function applyTheme(){
  var t=(S&&S.ajustes&&S.ajustes.tema)||'dark';
  var sys=(HAS_NATIVE&&Android.systemDark)?Android.systemDark():(mq?mq.matches:true);
  var dark=t==='auto'?sys:t==='dark';
  var root=document.documentElement,novo=dark?'dark':'light',antes=root.getAttribute('data-theme');
  var troca=function(){root.setAttribute('data-theme',novo)};
  if(themeReady&&antes&&antes!==novo)trocaSuave(troca,novo);else troca();
  themeReady=true;
  if(HAS_NATIVE&&Android.setBars)try{Android.setBars(dark)}catch(e){}
}
if(mq&&mq.addEventListener)mq.addEventListener('change',function(){if(S&&S.ajustes.tema==='auto')applyTheme()});
window.quitaSysTheme=function(){if(S&&S.ajustes.tema==='auto')applyTheme()};
window.addEventListener('scroll',function(){$('#top').classList.toggle('scrolled',window.scrollY>4)},{passive:true});
var TITLES={painel:'Visão geral',receitas:'Receitas',despesas:'Despesas',dividas:'Dívidas',relatorio:'Relatório'};

/* ---------------- render / eventos ---------------- */
function renderAll(){
  if(curTab==='painel')renderPainel();
  else if(curTab==='dividas')renderDividas();
  else if(curTab==='receitas')renderReceitas();
  else if(curTab==='despesas')renderDespesas();
  else renderRelatorio();
  var tb=$('#tab-'+curTab);if(tb){tb.insertAdjacentHTML('afterbegin','<h2 class="page-title">'+TITLES[curTab]+'</h2>');enableSwipe(tb)}
  updSyncDot(syncing?'run':undefined);
}
$$('nav.bottom button').forEach(function(b){b.onclick=function(){setTab(b.dataset.tab)}});
$('#fab').onclick=function(){if(curTab==='dividas')openDebtForm();else if(curTab==='despesas')openLancForm('despesa');else openLancForm('receita')};
$('#btnSettings').onclick=openSettings;
$('#btnEye').onclick=toggleOcultar;
pdfHTML=semMascara(pdfHTML);exportCSV=semMascara(exportCSV);reportText=semMascara(reportText);
$('#btnSync').onclick=function(){syncNow(true)};
window.quitaBack=function(){if(sheetOpen){closeSheet();return true}if(curTab!=='painel'){setTab('painel');return true}return false};
window.quitaResume=function(away){var lc=lockCfg();if(lc.on&&lc.pin&&away>30000&&!$('#lock').classList.contains('on'))showLock('unlock');if(S&&S.ajustes.tema==='auto')applyTheme();renderAll();if(temPlanilha()&&S.ajustes.pendente&&S.ajustes.auto)scheduleSync();autoBackup()};

load();
applyTheme();
updEye();
if(lockCfg().on&&lockCfg().pin){var _nl=/[?&]nolock=1/.test(location.search),_aw=0;try{_aw=HAS_NATIVE&&Android.awayMs?Android.awayMs():0}catch(e){}if(!_nl||_aw>30000)showLock('unlock')}
setTab('painel');
if(HAS_NATIVE&&Android.gLogin&&!googleOn()&&!S.ajustes.googlePulou)setTimeout(openGoogleIntro,350);
else if(precisaOnboard())setTimeout(function(){openOnboarding(0)},350);
syncAlerts();
if(temPlanilha()&&S.ajustes.pendente&&S.ajustes.auto)scheduleSync();
setTimeout(function(){autoBackup()},2500);
})();
