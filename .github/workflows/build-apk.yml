name: Build Quita APK
on:
  push:
    branches: [quita-app]
    paths-ignore: ['dist/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar APK
        id: build
        continue-on-error: true
        run: |
          mkdir -p dist
          set -o pipefail
          ./build.sh 2>&1 | tee dist/build.log
        env:
          QUITA_KS_PASS: ${{ secrets.QUITA_KS_PASS }}
      - name: Compilar Quita Acessos
        id: build2
        continue-on-error: true
        run: |
          set -o pipefail
          ./acessos/build.sh 2>&1 | tee dist/build-acessos.log
        env:
          QUITA_KS_PASS: ${{ secrets.QUITA_KS_PASS }}
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: Quita-apk
          path: dist/*.apk
      - name: Salvar APK e log no repositório
        if: always()
        run: |
          git config user.name "quita-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/
          git commit -m "Build ${{ steps.build.outcome }} [skip ci]" || echo "sem mudanças"
          git push
      - name: Resultado
        if: steps.build.outcome != 'success'
        run: exit 1
