name: Build Quita APK
on:
  push:
    branches: [quita-app]
    paths-ignore: ['dist/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar APK
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Quita-apk
          path: dist/*.apk
      - name: Salvar APK no repositório
        run: |
          git config user.name "quita-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/*.apk
          git commit -m "APK gerado [skip ci]" || echo "sem mudanças"
          git push
